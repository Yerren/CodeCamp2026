<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1155" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- 1. Input -->
  <text x="60" y="34" font-size="15" font-weight="600" fill="#666">1. INPUT</text>
  <rect x="60" y="44" width="480" height="210" rx="10" fill="#f4f6fa" stroke="#c5ccd8"/>
  <text font-size="13" fill="#333">
    <tspan x="78" y="72">For the following transcript, determine the target action the</tspan>
    <tspan x="78" y="90">user wants to take, the target application, and any additional</tspan>
    <tspan x="78" y="108">parameters.</tspan>
    <tspan x="78" y="132" fill="#888">…valid applications…</tspan>
    <tspan x="78" y="150" fill="#888">…schema…</tspan>
    <tspan x="78" y="178" font-weight="600">transcript: </tspan><tspan font-style="italic">"Hey Google, navigate to Ara."</tspan>
  </text>
  <text x="78" y="214" font-size="12" fill="#666">Output so far:</text>
  <rect x="165" y="200" width="200" height="22" rx="4" fill="#fff" stroke="#c5ccd8"/>
  <text x="173" y="216" font-size="12" fill="#aaa" font-style="italic">(empty)</text>

  <line x1="300" y1="258" x2="300" y2="296" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 2. LLM -->
  <rect x="220" y="300" width="160" height="80" rx="14" fill="#5b6ee1"/>
  <text x="300" y="347" text-anchor="middle" font-size="22" font-weight="600" fill="#fff">LLM</text>

  <line x1="300" y1="384" x2="300" y2="422" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 3. Probabilities + mask -->
  <text x="60" y="446" font-size="15" font-weight="600" fill="#666">2. NEXT-TOKEN PROBABILITIES + JSON MASK</text>
  <rect x="60" y="456" width="480" height="290" rx="10" fill="#fafafa" stroke="#ddd"/>
  <text x="80" y="482" font-size="12" fill="#888">token</text>
  <text x="190" y="482" font-size="12" fill="#888">probability</text>
  <text x="490" y="482" font-size="12" fill="#888" text-anchor="middle">valid JSON?</text>

  <g>
    <text x="80" y="518" font-size="15" font-family="Consolas, monospace" fill="#999" text-decoration="line-through">"Sure"</text>
    <rect x="190" y="504" width="190" height="20" fill="#ccc"/>
    <text x="386" y="519" font-size="12" fill="#999">38%</text>
    <text x="490" y="520" font-size="20" fill="#d64545" text-anchor="middle">✗</text>
  </g>
  <g>
    <text x="80" y="568" font-size="15" font-family="Consolas, monospace" fill="#1a7f37" font-weight="700">"{"</text>
    <rect x="190" y="554" width="150" height="20" fill="#2da44e"/>
    <text x="346" y="569" font-size="12" fill="#333">30%</text>
    <text x="490" y="570" font-size="20" fill="#2da44e" text-anchor="middle">✓</text>
  </g>
  <g>
    <text x="80" y="618" font-size="15" font-family="Consolas, monospace" fill="#999" text-decoration="line-through">"Here"</text>
    <rect x="190" y="604" width="85" height="20" fill="#ccc"/>
    <text x="281" y="619" font-size="12" fill="#999">17%</text>
    <text x="490" y="620" font-size="20" fill="#d64545" text-anchor="middle">✗</text>
  </g>
  <g>
    <text x="80" y="668" font-size="15" font-family="Consolas, monospace" fill="#999" text-decoration="line-through">"```"</text>
    <rect x="190" y="654" width="50" height="20" fill="#ccc"/>
    <text x="246" y="669" font-size="12" fill="#999">10%</text>
    <text x="490" y="670" font-size="20" fill="#d64545" text-anchor="middle">✗</text>
  </g>
  <g>
    <text x="80" y="718" font-size="15" font-family="Consolas, monospace" fill="#1a7f37" font-weight="700">"\n"</text>
    <rect x="190" y="704" width="25" height="20" fill="#2da44e"/>
    <text x="221" y="719" font-size="12" fill="#333">5%</text>
    <text x="490" y="720" font-size="20" fill="#2da44e" text-anchor="middle">✓</text>
  </g>

  <line x1="300" y1="750" x2="300" y2="788" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 4. Renormalise + pick -->
  <text x="60" y="812" font-size="15" font-weight="600" fill="#666">3. RENORMALISE &amp; PICK</text>
  <rect x="60" y="822" width="480" height="200" rx="10" fill="#f1faf3" stroke="#a8d8b5"/>
  <text x="80" y="862" font-size="15" font-family="Consolas, monospace" fill="#1a7f37" font-weight="700">"{"</text>
  <rect x="140" y="848" width="172" height="20" fill="#2da44e"/>
  <text x="318" y="863" font-size="12" fill="#333">86%</text>
  <text x="80" y="902" font-size="15" font-family="Consolas, monospace" fill="#1a7f37" font-weight="700">"\n"</text>
  <rect x="140" y="888" width="28" height="20" fill="#2da44e"/>
  <text x="174" y="903" font-size="12" fill="#333">14%</text>

  <text x="450" y="856" text-anchor="middle" font-size="13" fill="#555">sampled token:</text>
  <rect x="410" y="866" width="80" height="50" rx="8" fill="#2da44e"/>
  <text x="450" y="900" text-anchor="middle" font-size="26" font-family="Consolas, monospace" font-weight="700" fill="#fff">{</text>

  <text x="80" y="980" font-size="12" fill="#555">Output so far:</text>
  <rect x="165" y="966" width="200" height="24" rx="4" fill="#fff" stroke="#a8d8b5"/>
  <text x="175" y="983" font-size="14" font-family="Consolas, monospace" fill="#222">{</text>

  <!-- loop back up the left side -->
  <path d="M60,922 L30,922 L30,149 L56,149" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arr)"/>
  <text x="22" y="535" font-size="13" fill="#666" text-anchor="middle" transform="rotate(-90 22 535)">append token &amp; repeat</text>

  <!-- final result -->
  <text x="300" y="1062" text-anchor="middle" font-size="13" fill="#666">Repeat until the JSON is complete:</text>
  <text font-size="14" font-family="Consolas, monospace" fill="#333" text-anchor="middle">
    <tspan x="300" y="1090">{"target_application": "maps",</tspan>
    <tspan x="300" y="1110"> "target_action": "navigate",</tspan>
    <tspan x="300" y="1130"> "additional_parameters": {"destination": "Ara"}}</tspan>
  </text>
</svg>
